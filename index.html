<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPlayer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Background canvas for pixel particles -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-shell">

    <!-- Top App Bar -->
    <header class="top-bar">
      <span class="top-bar__logo">PixelPlayer</span>
      <div class="top-bar__actions">
        <button class="icon-btn" id="btn-visualizer" title="Toggle Visualizer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="14" width="3" height="6"/><rect x="7" y="10" width="3" height="10"/><rect x="12" y="6" width="3" height="14"/><rect x="17" y="2" width="3" height="18"/></svg>
        </button>
      </div>
    </header>

    <main class="player-container">

      <!-- Album Art Card -->
      <div class="art-card" id="art-card">
        <div class="art-pixel-grid" id="art-grid"></div>
        <div class="art-overlay">
          <div class="spin-ring"></div>
        </div>
        <div class="art-reflection"></div>
      </div>

      <!-- Visualizer (hidden by default) -->
      <div class="visualizer-wrap" id="visualizer-wrap">
        <canvas id="vis-canvas"></canvas>
      </div>

      <!-- Song Info -->
      <div class="song-info">
        <div class="song-info__badge">NOW PLAYING</div>
        <h1 class="song-title" id="song-title">music.mp3</h1>
        <p class="song-artist" id="song-artist">Unknown Artist</p>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn ctrl-btn--sm" id="btn-shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>

        <button class="ctrl-btn ctrl-btn--md" id="btn-prev" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <button class="ctrl-btn ctrl-btn--fab" id="btn-play" title="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button class="ctrl-btn ctrl-btn--md" id="btn-next" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
        </button>

        <button class="ctrl-btn ctrl-btn--sm" id="btn-repeat" title="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume-section">
        <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <div class="vol-track" id="vol-track">
          <div class="vol-fill" id="vol-fill"></div>
          <div class="vol-thumb" id="vol-thumb"></div>
        </div>
        <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>

      <!-- File loader -->
      <div class="file-loader">
        <label class="file-label" for="file-input">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
          Load Audio File
        </label>
        <input type="file" id="file-input" accept="audio/*" />
        <span class="file-hint">or place <code>music.mp3</code> in same folder</span>
      </div>

    </main>
  </div>

  <!-- Hidden audio element -->
  <audio id="audio" src="music.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
